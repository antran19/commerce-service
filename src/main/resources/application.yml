server:
  port: 8085

spring:
  application:
    name: commerce-service
  datasource:
    url: jdbc:postgresql://localhost:5436/commerce_db
    username: nexus
    password: nexus
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: commerce-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

nexus:
  outbox:
    # Rows already published to Kafka are deleted after this many days (unpublished rows never are).
    retention-days: 7
    cleanup-interval-ms: 3600000
  security:
    jwt:
      secret: "dev-only-secret-key-change-in-production-min-256-bits-long!!"
      expiration-minutes: 60
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      # whsec_... (Stripe dashboard, or printed by `stripe listen`). Blank = webhook rejects all calls.
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  checkout:
    # An Idempotency-Key is remembered this long (a retry within it gets the same order back).
    idempotency-retention-hours: 24
  cart:
    max-inactive-days: 30
  order:
    unpaid-timeout-minutes: 30
    unpaid-expiry-check-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info
